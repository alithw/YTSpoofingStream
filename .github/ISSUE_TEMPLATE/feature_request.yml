name: 💡 Feature Request
description: Suggest a new idea, enhancement, or client resolver integration for YTSpoofingStream
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for **YTSpoofingStream**! Please provide as much context as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen or how you envision this feature working.
      placeholder: "A clear and concise description of what you want to happen."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "I have tried..."

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, technical specs, screenshots, or API endpoint references.
