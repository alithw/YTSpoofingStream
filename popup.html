<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>YTSpoofingStream</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161625;
      --surface2: #1c1c35;
      --accent: #e94560;
      --accent-dim: rgba(233, 69, 96, 0.15);
      --text: #eaeaea;
      --dim: #777;
      --green: #00c853;
      --gold: #f59e0b;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }

    .hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .hdr svg {
      flex-shrink: 0;
    }

    .hdr h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .hdr .ver {
      font-size: 10px;
      color: var(--dim);
    }

    .sec {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .sec-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dim);
      margin-bottom: 6px;
    }

    /* Mode selector */
    .modes {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mode {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: 0.15s;
    }

    .mode:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .mode.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .mode input {
      display: none;
    }

    .dot {
      width: 14px;
      height: 14px;
      border: 2px solid #444;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .mode.active .dot {
      border-color: var(--accent);
    }

    .mode.active .dot::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .mode-info {
      flex: 1;
    }

    .mode-name {
      font-size: 11px;
      font-weight: 600;
    }

    .mode-desc {
      font-size: 9px;
      color: var(--dim);
    }

    .badge {
      font-size: 8px;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .badge-1 {
      background: var(--accent);
      color: #fff;
    }

    .badge-2 {
      background: var(--gold);
      color: #111;
    }

    /* Operation Modes */
    .op-modes {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .op-mode {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.15s;
    }

    .op-mode:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .op-mode.active {
      border-color: var(--accent);
      background: rgba(233, 69, 96, 0.12);
    }

    .op-mode input {
      display: none;
    }

    .op-mode-info {
      flex: 1;
    }

    .op-mode-name {
      font-size: 11px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .op-mode-desc {
      font-size: 9.5px;
      color: var(--dim);
      margin-top: 2px;
      line-height: 1.3;
    }

    .op-badge {
      font-size: 8px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .op-badge.safe {
      background: rgba(78, 204, 163, 0.2);
      color: var(--green);
      border: 1px solid rgba(78, 204, 163, 0.4);
    }

    .op-badge.ytm {
      background: rgba(255, 75, 75, 0.2);
      color: #ff5252;
      border: 1px solid rgba(255, 75, 75, 0.4);
    }

    .op-badge.tv {
      background: rgba(0, 217, 255, 0.2);
      color: #00d9ff;
      border: 1px solid rgba(0, 217, 255, 0.4);
    }

    .op-badge.hybrid {
      background: linear-gradient(135deg, rgba(255, 51, 75, 0.25), rgba(187, 134, 252, 0.25));
      color: #ff5277;
      border: 1px solid rgba(255, 82, 119, 0.4);
    }

    /* Toggle */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .row label {
      font-size: 12px;
      cursor: pointer;
    }

    .tog {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .tog input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .tog .sl {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
      pointer-events: none;
    }

    .tog .sl::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    .tog input:checked+.sl {
      background: var(--accent);
    }

    .tog input:checked+.sl::before {
      transform: translateX(16px);
    }

    .sel-method {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
      width: 140px;
    }

    .sel-method:focus {
      border-color: var(--accent);
    }

    /* Status */
    .st-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
    }

    .st-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .st-badge.off .st-dot {
      background: #555;
      animation: none;
    }

    .info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 2px 0;
    }

    .info .l {
      color: var(--dim);
    }

    .info .v {
      font-weight: 500;
      font-size: 10px;
    }

    /* Client Stats Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 9px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .grid-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .grid-item .cn {
      color: var(--dim);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-item .cs {
      font-weight: 600;
      color: #ccc;
      word-break: break-all;
      line-height: 1.25;
    }

    .grid-item.ok .cs {
      color: var(--green);
    }

    .grid-item.err .cs {
      color: var(--accent);
    }

    .grid-item.hq {
      background: var(--accent-dim);
      border: 1px solid var(--gold);
    }

    .grid-item.hq .cs {
      color: var(--gold);
      font-weight: 700;
    }

    .btns {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 7px;
      border: none;
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-p {
      background: var(--accent);
      color: #fff;
    }

    .btn-p:hover {
      background: #d63350;
    }

    .btn-s {
      background: var(--surface2);
      color: var(--text);
    }

    .btn-s:hover {
      background: #252545;
    }

    .log {
      font-family: 'Cascadia Code', monospace;
      font-size: 9px;
      max-height: 60px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 4px;
      color: var(--dim);
      line-height: 1.4;
    }
    .disabled-ui {
      opacity: 0.35 !important;
      pointer-events: none !important;
      filter: grayscale(0.85) !important;
      transition: opacity 0.25s ease, filter 0.25s ease;
    }
  </style>
</head>

<body>
  <div class="hdr">
    <svg width="26" height="26" viewBox="0 0 24 24">
      <rect width="24" height="24" rx="5" fill="#e94560" />
      <path d="M8 6L18 12L8 18Z" fill="#fff" />
    </svg>
    <div>
      <h1>YTSpoofingStream</h1>
      <div class="ver">v0.1.3 &bull; Studio 774 Dual-Stream Engine</div>
    </div>
  </div>

  <!-- MASTER ENABLE / DISABLE SECTION -->
  <div class="sec" style="border: 1px solid rgba(233, 69, 96, 0.3); background: rgba(233, 69, 96, 0.08);">
    <label class="row" for="en" style="cursor: pointer; margin: 0;">
      <span style="font-weight: 700; font-size: 13px; color: #fff;">Enable Extension</span>
      <span class="tog"><input type="checkbox" id="en" checked><span class="sl"></span></span>
    </label>
  </div>

  <div id="mainContentWrapper">
    <!-- OPERATION MODE (INDEPENDENT SWITCHES) -->
    <div class="sec">
      <div class="sec-title">Operation Mode</div>
      <div class="op-modes" id="opModes">
        <label class="op-mode active" data-opmode="HYBRID_HQ">
          <input type="radio" name="opmode" value="HYBRID_HQ" checked>
          <div class="op-mode-info">
            <div class="op-mode-name">
              <span>Mode: Hybrid Mix (774 Opus ★)</span>
              <span class="op-badge hybrid">Recommended</span>
            </div>
            <div class="op-mode-desc">Strict exact video • Harvests genuine Opus 280k+ from YTM & TV • Cancels if no 774</div>
          </div>
        </label>

        <label class="op-mode" data-opmode="YTM_HARVESTER">
          <input type="radio" name="opmode" value="YTM_HARVESTER">
          <div class="op-mode-info">
            <div class="op-mode-name">
              <span>Mode: YTM Harvester (774 Opus ★)</span>
              <span class="op-badge ytm">Direct HQ</span>
            </div>
            <div class="op-mode-desc">Strict exact video • Direct HTTPS Opus 774 from YouTube Music • Cancels if no 774</div>
          </div>
        </label>

        <label class="op-mode" data-opmode="TV_HEADLESS">
          <input type="radio" name="opmode" value="TV_HEADLESS">
          <div class="op-mode-info">
            <div class="op-mode-name">
              <span>Mode: Smart TV Relay (774 Opus ★)</span>
              <span class="op-badge tv">TV Premium</span>
            </div>
            <div class="op-mode-desc">Strict exact video • Requires TV Premium login • Deciphered 774 relay • Cancels if no 774</div>
          </div>
        </label>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="sec">
      <div class="sec-title">Controls</div>
      <label class="row" for="ar"><span>Auto-reload page on change</span>
        <span class="tog"><input type="checkbox" id="ar" checked><span class="sl"></span></span>
      </label>
      <label class="row" for="sp"><span>Stats for Nerds Override (774 Spoof)<br><span style="font-size:9px;color:var(--dim);">Hiển thị Opus 774 trong player Stats for Nerds</span></span>
        <span class="tog"><input type="checkbox" id="sp" checked><span class="sl"></span></span>
      </label>
    </div>

    <!-- STATUS -->
    <div class="sec">
      <div class="sec-title">Status</div>
      <div class="row">
        <span class="st-badge" id="stBadge"><span class="st-dot"></span><span id="stText">Active</span></span>
        <span style="font-size:10px;color:var(--dim)" id="swSt">SW: —</span>
      </div>
      <div class="info"><span class="l">Mode</span><span class="v" id="iMode" style="color:var(--gold);font-weight:700;">HYBRID_HQ (774)</span></div>
      <div class="info"><span class="l">Active Method</span><span class="v" id="iMethod" style="color:var(--gold);font-weight:700;">—</span></div>
      <div class="info"><span class="l">Streams</span><span class="v" id="iStreams">0</span></div>
      <div class="info"><span class="l">Active Audio</span><span class="v" id="iAudio">—</span></div>

      <div class="grid" id="statsGrid">
        <!-- Generated dynamically in popup.js -->
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="sec">
      <div class="sec-title">Actions</div>
      <div class="btns">
        <button class="btn btn-p" id="btnR">↻ Refresh Page</button>
        <button class="btn btn-s" id="btnL">⟳ Reload</button>
      </div>
    </div>

  <!-- AUTHENTICATION SECTIONS -->
  <div class="sec" id="tvAuthSec">
    <div class="sec-title">TVHTML5 Login</div>
    <div id="tvAuthContent">
      <div id="tvAuthStatus" style="font-size: 11px; margin-bottom: 6px; color: var(--dim);">Status: Checking...</div>
      <div id="tvAuthCodeContainer" style="display: none; text-align: center; margin-bottom: 8px;">
        <div style="font-size: 10px; color: var(--dim);">Enter code at <a href="https://youtube.com/activate" target="_blank" style="color: var(--accent);">youtube.com/activate</a></div>
        <div id="tvAuthCode" style="font-size: 16px; font-weight: 700; letter-spacing: 2px; margin-top: 4px;"></div>
      </div>
      <div class="btns">
        <button class="btn btn-p" id="btnTvLogin">Login to TV</button>
        <button class="btn btn-s" id="btnTvLogout" style="display: none;">Logout</button>
      </div>
    </div>
  </div>



  </div>

  <script src="popup.js"></script>
</body>

</html>
